<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kitchen</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      img {
        /* Fit the photo inside the (already sized to ~120px) kitchen window while keeping its
           aspect ratio. The window keeps the same padded geometry as the old rig version so
           food props/positions and the kitchen anchor don't move. */
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <img src="kitchen.webp" alt="cocina" />
    <script>
      // The old rig window was draggable via -webkit-app-region: drag on the rig page. Keep the
      // kitchen grabbable too (harmless as a static prop, keeps parity with how it felt before).
      document.body.style.cursor = 'grab';
    </script>
  </body>
</html>
