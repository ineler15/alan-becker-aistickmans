<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Character</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        /* Whole window is the drag handle (it's already sized tight around the character) -
           lets the user grab/drag it like the old Shimeji windows, without needing global
           click-through hit-testing to know when a click landed "on" the character. */
        -webkit-app-region: drag;
      }
      canvas {
        /* Fixed to the rig's own small visual box (see ?rw=/&rh= in character.js) and pinned to
           the window's bottom-center - the actual OS window is padded out bigger than this so
           the speech bubble below has somewhere valid to render, without changing the
           character's on-screen size (that's the scale-fit target in character.js's draw()). */
        display: block;
        background: transparent;
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
      }
      #speech {
        /* Was `bottom: 100%` (fully above the container) - a BrowserWindow can only render
           inside its own rectangle, so that placed the whole bubble off-window and it was never
           actually visible, at any window size. Anchored to the window's own top edge instead,
           which now has real padding above the (smaller, bottom-pinned) canvas to hold it. */
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.93);
        color: #111;
        padding: 4px 8px;
        border-radius: 8px;
        font-family: system-ui, sans-serif;
        font-size: 11px;
        max-width: 200px;
        white-space: normal;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div style="position: relative; width: 100%; height: 100%;">
      <div id="speech"></div>
      <canvas id="c"></canvas>
    </div>
    <script src="poseLibrary.js"></script>
    <script src="face.js"></script>
    <script src="character.js"></script>
  </body>
</html>
