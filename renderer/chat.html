<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hablar con el stickman</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #eee;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
        padding: 12px;
        gap: 8px;
        position: relative;
      }
      /* Shown only in the legacy (sprite) build - chat.js flips this on when
         ?legacy=1 is in the window's query params (main.js adds it). */
      #legacyTag {
        display: none;
        position: absolute;
        top: 8px;
        right: 8px;
        background: #b45309;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 10px;
        letter-spacing: 1px;
        user-select: none;
      }
      select {
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 6px;
        font-size: 13px;
        font-family: inherit;
      }
      textarea {
        flex: 1;
        resize: none;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 8px;
        font-size: 14px;
        font-family: inherit;
      }
      button {
        padding: 8px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #2563eb;
      }
      #giveSnack {
        background: #b45309;
      }
      #giveSnack:hover {
        background: #92400e;
      }
    </style>
  </head>
  <body>
    <div id="legacyTag">LEGACY</div>
    <select id="target"></select>
    <textarea id="message" placeholder="Escribile algo... (Enter para enviar)" autofocus></textarea>
    <button id="send">Enviar</button>
    <button id="giveSnack">🍪 Darle un alfajor</button>
    <button id="reviveBtn" style="margin-top: 8px; background: #43a047">💖 Revivir (si está muerto)</button>
    <script src="chat.js"></script>
  </body>
</html>
